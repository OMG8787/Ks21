<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>🧮 全策略試算</title>
  <!--
    全策略試算（370 格驗算表）
    --------------------------------------------------------------------------
    兩種算法並列對照：
    1. 精算（即時）：拿現有的 BJ.evaluate() / BJ.dealerDist()（跟「最佳基本策略」用的是同一套、
       沒有改過的公式）直接算出精確機率，瞬間完成。
    2. 模擬驗算（可選、要跑很久）：對每一格的每一個合法動作，各自真正玩 N 局（N 可設定，
       強制第一個動作，之後照最佳基本策略打到底），用實際模擬的結果去對照精算是否一致。
       這是「驗算」的本意：兩種獨立算法互相印證。
    370 = 硬牌 4~21（18 種）+ 軟牌 13~21（9 種）+ 對子 A~10（10 種），各乘莊家 10 種。
    不會寫入資料庫，也不會影響任何現有頁面；只有管理者看得到（從首頁「🛠 管理」進來）。
  -->
  <link rel="stylesheet" href="ks-common.css" />
  <style>
    .vt-table { font-size: 12.5px; }
    .vt-table th, .vt-table td { padding: 3px 4px; text-align: center; white-space: nowrap; }
    .vt-table td.hand { text-align: left; font-weight: 600; white-space: nowrap; }
    .vt-cell { line-height: 1.5; }
    .vt-cell .act { display: inline-block; min-width: 30px; }
    .vt-cell .best { font-weight: 700; color: var(--accent); }
    .vt-cell .na { color: var(--muted); }
    .vt-cell .sim { display: block; font-size: 11px; color: var(--muted); }
    .vt-cell .sim.diff { color: var(--bad); font-weight: 700; }
    .vt-cell .sim-log-link { margin-left: 4px; text-decoration: none; cursor: pointer; }
    .vt-cell.running { outline: 2px solid var(--accent); }
    .vt-controls input[type=number] { width: 90px; }
    .vt-controls .row { align-items: center; }
    .sim-bar { position: sticky; top: 0; z-index: 5; }
    .sim-progress { height: 10px; background: #e3e8f1; border-radius: 6px; overflow: hidden; margin: 6px 0; }
    .sim-progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
    .sim-status { font-size: 13px; }
  </style>
  <script src="ks-config.js"></script>
  <script src="ks-login-guard.js"></script>
</head>

<body>
  <div class="wrap" id="app" style="max-width:1100px;margin:0 auto;"></div>
  <script src="ks-core.js"></script>
  <script src="ks-blackjack.js"></script>
  <script src="ks-auth.js"></script>
  <script>
    (function () {
      const KSU = KS, BJ = KSU.BJ, ui = KSU.ui, h = ui.h, auth = KSU.auth;
      const app = ui.$('app');

      /* ---------------- 代表牌型（跟 generateOptimalStrategy 用的是同一套代表組合，另外補了 21 點那一列） ---------------- */
      const HARD_REP = { 4: ['2', '2'], 5: ['2', '3'], 6: ['2', '4'], 7: ['2', '5'], 8: ['3', '5'], 9: ['4', '5'], 10: ['4', '6'], 11: ['5', '6'], 12: ['10', '2'], 13: ['10', '3'], 14: ['10', '4'], 15: ['10', '5'], 16: ['10', '6'], 17: ['10', '7'], 18: ['10', '8'], 19: ['10', '9'], 20: ['10', '10'], 21: ['10', '5', '6'] };
      const SOFT_REP = { 13: ['A', '2'], 14: ['A', '3'], 15: ['A', '4'], 16: ['A', '5'], 17: ['A', '6'], 18: ['A', '7'], 19: ['A', '8'], 20: ['A', '9'], 21: ['A', '2', '8'] };
      const PAIR_VALS = [11, 10, 9, 8, 7, 6, 5, 4, 3, 2]; // 11=A,A
      const pairRank = pv => (pv === 11 ? 'A' : String(pv));
      const pairRep = pv => [pairRank(pv), pairRank(pv)];
      const BIG = ['10', 'J', 'Q', 'K', 'A'], SMALL = ['2', '3', '4', '5', '6'];
      const HARD_ORDER = Object.keys(HARD_REP).map(Number).sort((a, b) => b - a);
      const SOFT_ORDER = Object.keys(SOFT_REP).map(Number).sort((a, b) => b - a);

      // 把「已出現 n 張」依序從指定的 5 個點數均分扣掉（扣到該點數沒牌就跳過），回傳剩餘的 13 點數張數表
      function depleted(full, ranks, n) {
        const c = Object.assign({}, full);
        let left = n, guard = 0;
        while (left > 0 && guard < 100000) {
          const r = ranks[guard % ranks.length];
          if (c[r] > 0) { c[r]--; left--; }
          guard++;
          if (guard % ranks.length === 0 && ranks.every(x => c[x] === 0)) break; // 這個方向的牌已經扣光
        }
        return c;
      }

      function fullCounts(decks) {
        const c = {};
        KSU.RANKS.forEach(r => { c[r] = 4 * decks; });
        return c;
      }

      function baseComposition(cfg) {
        const full0 = fullCounts(cfg.decks);
        const small = cfg.small > 0 ? depleted(full0, SMALL, cfg.small) : full0;
        return cfg.big > 0 ? depleted(small, BIG, cfg.big) : small;
      }

      /* ---------------- 精算：BJ.evaluate() / BJ.dealerDist()，跟網站其他地方用的是同一套公式 ---------------- */
      function calcCell(R, counts10Base, cards, upRank, opt) {
        const c10 = counts10Base.slice();
        cards.forEach(r => { const i = KSU.idx10(r); if (c10[i] > 0) c10[i]--; });
        const twoCard = cards.length === 2;
        const isPair = opt.isPair;
        const total21 = BJ.handInfo(cards).total === 21;
        const L = {
          stand: true,
          hit: !total21,
          double: twoCard && !total21,
          split: isPair,
          surrender: twoCard && R.surrender !== 'none' && !(R.noSurrenderVsAce && upRank === 'A')
        };
        if (L.double) {
          const info = BJ.handInfo(cards);
          if (isPair) L.doubleFree = R.freeDouble && !info.soft && (opt.pv * 2) >= 9 && (opt.pv * 2) <= 11;
          else L.doubleFree = R.freeDouble && !info.soft && info.total >= 9 && info.total <= 11;
        }
        const e = BJ.evaluate(cards, upRank, c10, R, L, { D: opt.D, fromAA: opt.pv === 11 });
        const out = {};
        ['stand', 'hit', 'double', 'split', 'surrender'].forEach(k => {
          if (e[k]) out[k] = { ev: e[k].ev, win: e[k].w / Math.max(1e-9, e[k].w + e[k].p + e[k].l) };
        });
        out.best = e.best;
        return out;
      }

      function runAll(cfg) {
        const R = Object.assign({}, BJ.PRESETS[cfg.game]);
        const full = baseComposition(cfg);
        const rows = { hard: [], soft: [], pair: [] };
        BJ.DEALER_VALS.forEach(d => {
          const upRank = d === 11 ? 'A' : String(d);
          const c10base = BJ.toCounts10(full);
          const ui0 = KSU.idx10(upRank);
          if (c10base[ui0] > 0) c10base[ui0]--;
          const D = BJ.dealerDist(ui0, c10base, R);
          HARD_ORDER.forEach(t => {
            const cell = calcCell(R, c10base, HARD_REP[t].slice(), upRank, { D, isPair: false });
            (rows.hard[t] || (rows.hard[t] = {}))[d] = cell;
          });
          SOFT_ORDER.forEach(t => {
            const cell = calcCell(R, c10base, SOFT_REP[t].slice(), upRank, { D, isPair: false });
            (rows.soft[t] || (rows.soft[t] = {}))[d] = cell;
          });
          PAIR_VALS.forEach(pv => {
            const cell = calcCell(R, c10base, pairRep(pv), upRank, { D, isPair: true, pv });
            (rows.pair[pv] || (rows.pair[pv] = {}))[d] = cell;
          });
        });
        return rows;
      }

      /* ---------------- 畫面：精算表格 ---------------- */
      const ACT_LABEL = { hit: 'H', stand: 'S', double: 'D', split: 'P', surrender: 'R' };
      const ACT_NAME = { hit: '要牌', stand: '停牌', double: '加倍', split: '分牌', surrender: '投降' };
      const pct = x => (x * 100).toFixed(1) + '%';
      const evPct = x => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
      const jobKey = (kind, key, d, action) => `${kind}-${key}-${d}-${action}`;

      function cellHtml(kind, key, cell) {
        if (!cell) return '<span class="na">—</span>';
        const order = ['stand', 'hit', 'double', 'split', 'surrender'];
        return order.filter(k => cell[k]).map(k => {
          const v = cell[k];
          const isBest = k === cell.best;
          return `<span class="act${isBest ? ' best' : ''}" data-cell="${kind}-${key}" data-act="${k}" title="${ACT_NAME[k]}：精算 勝率 ${pct(v.win)}、每注EV ${evPct(v.ev)}">${ACT_LABEL[k]} ${pct(v.win)}/${evPct(v.ev)}<span class="sim" data-sim="${jobKey(kind, key, 0, k)}"></span></span>`;
        }).join('<br>');
      }

      function buildTable(title, order, kind, rowsObj, labelFn) {
        const box = h('div', { class: 'panel' });
        box.appendChild(h('h3', { text: title, style: { marginTop: 0 } }));
        const tbl = h('table', { class: 'vt-table' });
        const head = h('tr', null, h('th', { text: '玩家牌' }), BJ.DEALER_VALS.map(d => h('th', { text: d === 11 ? 'A' : d })));
        tbl.appendChild(head);
        order.forEach(key => {
          const tr = h('tr', null, h('td', { class: 'hand', text: labelFn(key) }));
          BJ.DEALER_VALS.forEach(d => {
            const td = h('td', { class: 'vt-cell', id: `td-${kind}-${key}-${d}` });
            td.innerHTML = cellHtml(kind, key, rowsObj[key] && rowsObj[key][d]).replace(/data-sim="([a-z]+-[0-9]+)-0-/g, `data-sim="$1-${d}-`);
            tr.appendChild(td);
          });
          tbl.appendChild(tr);
        });
        box.appendChild(h('div', { class: 'table-wrap' }, tbl));
        return box;
      }

      let lastRows = null, lastCfg = null;
      function render(cfg) {
        const t0 = performance.now();
        const rows = runAll(cfg);
        const ms = (performance.now() - t0).toFixed(0);
        lastRows = rows; lastCfg = cfg;
        const out = ui.$('result');
        out.innerHTML = '';
        out.appendChild(h('p', { class: 'muted', text: `精算 370 格耗時 ${ms} 毫秒。每格依序列出合法動作：勝率%／每注EV%（不含和局計入分母的勝率；EV 以原始下注 1 注為基準，加倍時反映 2 倍注的輸贏）。藍色粗體＝這一格精算 EV 最高的動作。灰色小字是模擬驗算結果（要按下面「開始模擬驗算」才會出現）。` }));
        out.appendChild(buildTable('硬牌（18 種 × 莊家 10 種 = 180 格）', HARD_ORDER, 'hard', rows.hard, t => '硬 ' + t));
        out.appendChild(buildTable('軟牌（9 種 × 莊家 10 種 = 90 格）', SOFT_ORDER, 'soft', rows.soft, t => 'A,' + (t - 11)));
        out.appendChild(buildTable('對子（10 種 × 莊家 10 種 = 100 格）', PAIR_VALS, 'pair', rows.pair, pv => (pv === 11 ? 'A,A' : pv + ',' + pv)));
        simUI.reset();
      }

      /* ---------------- 模擬驗算引擎 ---------------- */
      // 建立代表牌的 fixed 陣列：硬21／軟21 是 3 張代表組合，沒辦法用 Round 的 fixed（只支援前兩張），略過模擬（只有停牌一種動作，精算已經是封閉公式，不需要驗算）
      function buildJobs(cfg, rows) {
        const jobs = [];
        HARD_ORDER.forEach(key => {
          if (key === 21) return;
          BJ.DEALER_VALS.forEach(d => Object.keys(rows.hard[key][d]).forEach(action => {
            if (action !== 'best' && rows.hard[key][d][action]) jobs.push({ kind: 'hard', key, d, action, cards: HARD_REP[key] });
          }));
        });
        SOFT_ORDER.forEach(key => {
          if (key === 21) return;
          BJ.DEALER_VALS.forEach(d => Object.keys(rows.soft[key][d]).forEach(action => {
            if (action !== 'best' && rows.soft[key][d][action]) jobs.push({ kind: 'soft', key, d, action, cards: SOFT_REP[key] });
          }));
        });
        PAIR_VALS.forEach(pv => {
          BJ.DEALER_VALS.forEach(d => Object.keys(rows.pair[pv][d]).forEach(action => {
            if (action !== 'best' && rows.pair[pv][d][action]) jobs.push({ kind: 'pair', key: pv, d, action, cards: pairRep(pv) });
          }));
        });
        return jobs;
      }

      // 跑單一「格子 + 動作」：強制第一個動作，之後照最佳基本策略打到底（跟精算一樣的規則、牌組設定）
      // 每一局都用設定的牌組組成重新洗牌，牌況不會隨著跑的局數累積變化，才能跟精算（固定組成）互相對照
      const LOG_LIMIT = 50; // 每個「格子＋動作」最多留幾筆局紀錄給人工檢查
      function simulateJob(R, baseCounts, opt, job, N, onChunk, shouldStop) {
        return new Promise(resolve => {
          const upRank = job.d === 11 ? 'A' : String(job.d);
          const shoe = new KSU.Shoe({ counts: baseCounts, penetration: 1 });
          let wins = 0, pushes = 0, losses = 0, netSum = 0, i = 0;
          const logs = [];
          function tick() {
            if (shouldStop()) { resolve({ done: i, stopped: true, logs }); return; }
            const t0 = Date.now();
            while (i < N && Date.now() - t0 < 25) {
              shoe.shuffle();
              const rd = new BJ.Round({ rules: R, shoe: shoe }, [{ bet: 1, fixed: job.cards }], { dealerUp: upRank }).start();
              let first = true;
              let guard = 0;
              while (rd.phase === 'player' && guard++ < 50) {
                const c = rd.current();
                const L = rd.legal(c.hand, c.seat);
                let a;
                if (first) { a = L[job.action] ? job.action : 'stand'; first = false; }
                else a = BJ.decide(opt, c.hand, rd.dealer[0], L, {});
                rd.act(L[a] ? a : 'stand');
              }
              rd.playDealer();
              const net = rd.seats[0].net;
              if (logs.length < LOG_LIMIT) {
                logs.push({
                  dealer: rd.dealer.map(KSU.cardText), dealerOutcome: rd.dealerOutcome(),
                  hands: rd.seats[0].hands.map(x => ({ cards: x.cards.map(KSU.cardText), total: BJ.handTotal(x.cards), actions: x.actions.slice(), result: x.result, profit: x.profit, note: x.note || '', free: x.freeDouble, freeSplit: x.freeSplit })),
                  net
                });
              }
              shoe.endRound();
              netSum += net;
              if (net > 1e-9) wins++; else if (net < -1e-9) losses++; else pushes++;
              i++;
            }
            onChunk(i, N, { win: wins / Math.max(1, i), ev: netSum / Math.max(1, i) });
            if (i >= N) { resolve({ done: i, stopped: false, win: wins / N, ev: netSum / N, wins, pushes, losses, logs }); return; }
            setTimeout(tick, 0);
          }
          tick();
        });
      }

      const RES_LABEL = { W: '勝', L: '負', P: '和' };
      const OUT_LABEL = { '17': '17', '18': '18', '19': '19', '20': '20', '21': '21', BJ: 'BJ', '22': '22(平手)', bust: '爆牌' };
      function fmtSimLog(e) {
        const hands = e.hands.map(x => `[${x.cards.join(' ')}]=${x.total}${x.actions.length ? ' ' + x.actions.map(a => BJ.ACTION_LABEL[a] || a).join('→') : ''}${x.free ? '(免費)' : ''}${x.freeSplit ? '[免費手]' : ''} ` +
          `<span class="res-${x.result}" style="color:${x.result === 'W' ? '#1a8f4c' : x.result === 'L' ? '#c43c3c' : '#8a6d00'}">${RES_LABEL[x.result] || ''}${x.note ? '(' + ui.esc(x.note) + ')' : ''} ${ui.signed(x.profit, 0)}</span>`
        ).join('；');
        const dOut = e.dealerOutcome ? OUT_LABEL[e.dealerOutcome] || e.dealerOutcome : '未補完';
        return `<div class="log-row">莊家 [${e.dealer.join(' ')}] ${dOut}　${hands}　<b>合計 ${ui.signed(e.net, 0)}</b></div>`;
      }

      function buildSimController() {
        const roundsInput = h('input', { type: 'number', min: 1000, step: 1000, value: 10000000, style: { width: '130px' } });
        const startBtn = h('button', { class: 'btn-good', text: '▶ 開始模擬驗算' });
        const stopBtn = h('button', { class: 'btn-danger', text: '■ 停止', disabled: true });
        const progFill = h('div');
        const progWrap = h('div', { class: 'sim-progress' }, progFill);
        const statusLine = h('div', { class: 'sim-status muted', text: '按「開始模擬驗算」會依序對每一格的每個動作各跑設定的局數，可能要跑很久，隨時可以按「停止」，已經跑完的格子結果會留著。' });
        const jobCountLine = h('div', { class: 'muted' });
        let stopReq = false, running = false;

        async function start() {
          if (!lastRows || !lastCfg) return;
          const N = Math.max(1000, Math.floor(+roundsInput.value) || 10000000);
          const jobs = buildJobs(lastCfg, lastRows);
          const R = Object.assign({}, BJ.PRESETS[lastCfg.game]);
          const baseCounts = baseComposition(lastCfg);
          const opt = BJ.generateOptimalStrategy(R, baseCounts);
          jobCountLine.textContent = `共 ${jobs.length} 個「格子＋動作」要跑，每個 ${N.toLocaleString()} 局（硬21／軟21 因為代表牌型是3張、只有停牌一種合法動作，精算已是封閉公式，不需要模擬）。`;
          stopReq = false; running = true;
          startBtn.disabled = true; stopBtn.disabled = false; roundsInput.disabled = true;
          const t0 = Date.now();
          let jobsDone = 0;
          for (const job of jobs) {
            const upLabel = job.d === 11 ? 'A' : job.d;
            const handLabel = job.kind === 'hard' ? '硬 ' + job.key : job.kind === 'soft' ? 'A,' + (job.key - 11) : (job.key === 11 ? 'A,A' : job.key + ',' + job.key);
            const td = ui.$(`td-${job.kind}-${job.key}-${job.d}`);
            if (td) td.classList.add('running');
            const simSpan = document.querySelector(`[data-sim="${jobKey(job.kind, job.key, job.d, job.action)}"]`);
            const r = await simulateJob(R, baseCounts, opt, job, N, (done, total, running) => {
              const elapsed = (Date.now() - t0) / 1000;
              statusLine.textContent = `[玩家：${handLabel}，莊家 ${upLabel}] ${ACT_NAME[job.action]}　${done.toLocaleString()} / ${total.toLocaleString()}　（目前這格暫估 勝率 ${pct(running.win)}／EV ${evPct(running.ev)}）`;
              progFill.style.width = (done / total * 100) + '%';
              const speed = done / Math.max(0.5, elapsed - (jobsDone ? 0 : 0));
            }, () => stopReq);
            if (td) td.classList.remove('running');
            if (r.stopped) {
              statusLine.textContent = `已停止。這一格（${handLabel} vs ${upLabel}，${ACT_NAME[job.action]}）跑到 ${r.done.toLocaleString()} / ${N.toLocaleString()} 局，沒有寫入（局數不足，結果不穩定，不採用）。已完成 ${jobsDone} / ${jobs.length} 個動作。`;
              break;
            }
            if (simSpan) {
              const exact = lastRows[job.kind][job.key][job.d][job.action];
              const diff = Math.abs(r.ev - exact.ev) > 0.01 || Math.abs(r.win - exact.win) > 0.01;
              simSpan.className = 'sim' + (diff ? ' diff' : '');
              simSpan.title = `模擬：勝 ${r.wins.toLocaleString()}、和 ${r.pushes.toLocaleString()}、負 ${r.losses.toLocaleString()}`;
              simSpan.innerHTML = '';
              simSpan.appendChild(document.createTextNode(`｜模擬 ${pct(r.win)}/${evPct(r.ev)}（${N.toLocaleString()}局）`));
              if (r.logs && r.logs.length) {
                simSpan.appendChild(h('a', {
                  href: '#', class: 'sim-log-link', text: '🔍',
                  title: `看其中 ${r.logs.length} 筆實際模擬的局，檢查算得對不對`,
                  onclick: ev2 => {
                    ev2.preventDefault(); ev2.stopPropagation();
                    ui.logViewer(`模擬紀錄：${handLabel} 對莊家 ${upLabel}，${ACT_NAME[job.action]}（精算 勝率 ${pct(exact.win)}/EV ${evPct(exact.ev)}；這次模擬 勝率 ${pct(r.win)}/EV ${evPct(r.ev)}，共 ${N.toLocaleString()} 局，這裡只列前 ${r.logs.length} 筆）`, r.logs.map(fmtSimLog));
                  }
                }));
              }
            }
            jobsDone++;
            const elapsedTotal = (Date.now() - t0) / 1000;
            const avgPerJob = elapsedTotal / jobsDone;
            const etaSec = avgPerJob * (jobs.length - jobsDone);
            jobCountLine.textContent = `已完成 ${jobsDone} / ${jobs.length} 個動作；已花費 ${fmtTime(elapsedTotal)}；預估剩餘 ${fmtTime(etaSec)}（用目前平均速度估的，會隨速度變動調整）。`;
          }
          running = false;
          startBtn.disabled = false; stopBtn.disabled = true; roundsInput.disabled = false;
          if (!stopReq && jobsDone === jobs.length) statusLine.textContent = `全部跑完了：${jobs.length} 個動作，每個 ${N.toLocaleString()} 局，共花費 ${fmtTime((Date.now() - t0) / 1000)}。`;
        }
        function fmtTime(sec) {
          if (!isFinite(sec) || sec < 0) return '—';
          if (sec < 60) return Math.round(sec) + ' 秒';
          if (sec < 3600) return Math.round(sec / 60) + ' 分鐘';
          return (sec / 3600).toFixed(1) + ' 小時';
        }
        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', () => { stopReq = true; });
        const box = h('div', { class: 'panel sim-bar' },
          h('h3', { text: '🎲 模擬驗算', style: { marginTop: 0 } }),
          h('p', { class: 'muted', style: { margin: '0 0 6px' }, text: '對每一格的每一個合法動作，各自真正玩 N 局：強制第一個動作，之後照目前規則下的最佳基本策略打到底，統計實際的勝率/EV，跟上面的精算數字對照。兩者應該很接近；如果差距明顯（紅字），代表局數還不夠多，或精算/模擬其中一處可能有問題，值得進一步檢查。' }),
          h('div', { class: 'row' }, h('label', null, '每個動作模擬局數　', roundsInput), startBtn, stopBtn),
          progWrap, statusLine, jobCountLine);
        return { box, reset: () => { progFill.style.width = '0%'; statusLine.textContent = '按「開始模擬驗算」會依序對每一格的每個動作各跑設定的局數，可能要跑很久，隨時可以按「停止」，已經跑完的格子結果會留著。'; jobCountLine.textContent = ''; } };
      }
      let simUI;

      function buildControls() {
        const gameSel = h('select', null, [['star22', '麗星郵輪22點'], ['american', '美式21點'], ['british', '英式21點']].map(([v, t]) => h('option', { value: v, text: t })));
        gameSel.value = 'star22';
        const decks = h('input', { type: 'number', min: 1, max: 8, value: 5 });
        const big = h('input', { type: 'number', min: 0, value: 0 });
        const small = h('input', { type: 'number', min: 0, value: 0 });
        const playersSel = h('select', null, [1, 2, 3, 4, 5, 6, 7, 8].map(n => h('option', { value: n, text: n + ' 位' })));
        playersSel.value = 1;
        const estBtn = h('button', { class: 'btn-small', text: '依人數估算已出現張數', onclick: () => {
          const n = +playersSel.value, shown = n * 2 + 1; // 每人2張 + 莊家明牌1張
          small.value = Math.round(shown * 5 / 13);
          big.value = Math.round(shown * 5 / 13);
        } });
        const goBtn = h('button', { class: 'btn-good', text: '重新精算', onclick: () => cfg() && render(cfg()) });
        const cfg = () => {
          const d = Math.max(1, +decks.value || 1), b = Math.max(0, +big.value || 0), s = Math.max(0, +small.value || 0);
          if (b + s >= d * 52) { alert('已出現的大牌＋小牌張數不能超過整個牌靴的張數'); return null; }
          return { game: gameSel.value, decks: d, big: b, small: s };
        };
        const box = h('div', { class: 'panel vt-controls' },
          h('h3', { text: '⚙️ 設定', style: { marginTop: 0 } }),
          h('div', { class: 'row' }, h('label', null, '遊戲規則　', gameSel), h('label', null, '副數　', decks)),
          h('div', { class: 'row' }, h('label', null, '本局已出現大牌(10/J/Q/K/A)　', big), h('label', null, '本局已出現小牌(2-6)　', small)),
          h('div', { class: 'row' }, h('label', null, '牌桌人數　', playersSel), estBtn),
          h('div', { class: 'row' }, goBtn),
          h('small', { class: 'muted', text: '大牌／小牌已出現的張數，是從整副牌裡直接扣除（模擬這一局已經看過這些牌），計算方式跟「算牌方式」裡的「本局已出現大牌/小牌張數」完全一樣。「依人數估算」只是用平均值幫你猜一個起始值，可以手動改。改這裡的設定後要按「重新精算」。' }));
        return { box, cfg };
      }

      /* ---------------- 權限檢查：只有管理者能看 ---------------- */
      async function boot() {
        app.innerHTML = '<div class="panel"><p class="muted">正在確認權限…</p></div>';
        if (auth.enabled()) {
          const key = auth.getKey();
          if (!key) { location.replace('index.html?next=' + encodeURIComponent(location.pathname.split('/').pop())); return; }
          try { await auth.check(); }
          catch (e) {
            if (e.kicked) { location.replace('index.html?next=' + encodeURIComponent(location.pathname.split('/').pop()) + '&msg=' + encodeURIComponent(e.message)); return; }
            app.innerHTML = '';
            app.appendChild(h('div', { class: 'panel' }, h('div', { class: 'alert', text: e.message }), h('a', { href: 'index.html', text: '← 回首頁' })));
            return;
          }
        }
        if (!auth.isAdmin()) {
          app.innerHTML = '';
          app.appendChild(h('div', { class: 'panel' }, h('div', { class: 'alert', text: '這個頁面只有管理者能用。' }), h('a', { href: 'index.html', text: '← 回首頁' })));
          return;
        }
        app.innerHTML = '';
        const bar = h('div', { class: 'topbar' }, h('a', { href: 'index.html', text: '← 回首頁' }),
          h('span', { text: auth.enabled() ? `👤 ${auth.user.name}（${auth.user.id}・管理者）` : '本機模式（視為管理者）' }));
        app.appendChild(bar);
        app.appendChild(h('h1', { text: '🧮 全策略試算' }));
        app.appendChild(h('p', { class: 'muted', text: '370 格驗算表：硬牌 4~21、軟牌 A2~A21、對子 A,A~10,10，各對上莊家 10 種明牌，列出每個合法動作的勝率與每注期望值（EV）。精算瞬間完成；下面可以再加跑模擬驗算互相對照。純計算，不會存進資料庫，也不影響任何其他頁面。' }));
        const { box, cfg } = buildControls();
        app.appendChild(box);
        simUI = buildSimController();
        app.appendChild(simUI.box);
        app.appendChild(h('div', { id: 'result' }));
        const c = cfg();
        if (c) render(c);
      }
      boot();
    })();
  </script>
</body>

</html>
